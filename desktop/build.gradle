plugins {
    id "io.github.fourlastor.construo" version "2.0.1"
}

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "com.gungame.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

jar {
    manifest {
        attributes 'Main-Class': project.ext.mainClassName
    }
}

// === Construo: упаковка с JDK и .exe ===
import io.github.fourlastor.construo.Target

construo {
    // имя исполняемого файла/папки
    name.set("GunGame")
    // человекочитаемое имя
    humanName.set("Gun Game")
    // главная точка входа
    mainClass.set(project.ext.mainClassName)

    // куда складывать готовые сборки
    outputDir.set(rootProject.layout.projectDirectory.dir("dist"))

    roast {
        vmArgs.addAll("-Xms100m -Xmx500m")
    }

    var jdkVersion = "21.0.3+9"
    var jdkBaseUrl = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-$jdkVersion"
    // TODO: надо будет иконку добавить!
    targets {
        create("winX64", Target.Windows) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set("$jdkBaseUrl/OpenJDK21U-jdk_x64_windows_hotspot_${jdkVersion.replace("+", "_")}.zip")
        }

        create("linuxX64", Target.Linux) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set("$jdkBaseUrl/OpenJDK21U-jdk_x64_linux_hotspot_${jdkVersion.replace("+", "_")}.tar.gz")
        }

        create("macAarch64", Target.MacOs) {
            architecture.set(Target.Architecture.AARCH64)
            identifier.set("com.gungame.desktop")
            jdkUrl.set("$jdkBaseUrl/OpenJDK21U-jdk_aarch64_mac_hotspot_${jdkVersion.replace("+", "_")}.tar.gz")
            // macIcon.set(project.file("icon.icns"))
        }
    }
}