plugins {
    id "io.github.fourlastor.construo" version "2.0.1"
}

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "com.gungame.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

jar {
    manifest {
        attributes 'Main-Class': project.ext.mainClassName
    }
}

// === Construo: упаковка с JDK и .exe ===
import io.github.fourlastor.construo.Target

construo {
    // имя исполняемого файла/папки
    name.set("GunGame")
    // человекочитаемое имя (для .app на macOS и т.п.)
    humanName.set("Gun Game")
    // главная точка входа
    mainClass.set(project.ext.mainClassName)

    // куда складывать готовые сборки (оставлю как у Construo по умолчанию — build/construo/dist)
    // outputDir.set(layout.buildDirectory.dir("construo/dist").get().asFile)

    roast {
        // любые VM-аргументы
        vmArgs.addAll("-Xmx1G")
    }

    targets {
        create("winX64", Target.Windows) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set("https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.3%2B9/OpenJDK21U-jdk_x64_windows_hotspot_21.0.3_9.zip")

        }

         create("linuxX64", Target.Linux) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.11_9.tar.gz")
        }
        create("macAarch64", Target.MacOs) {
             architecture.set(Target.Architecture.AARCH64)
             identifier.set("com.gungame.desktop")
             jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.11%2B9/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.11_9.tar.gz")
             // macIcon.set(project.file("icon.icns"))
        }
    }
}