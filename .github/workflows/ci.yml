name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck and build
              run: npm run build

            - name: Lint
              run: npm run lintcheck

            - name: Check formatting
              run: npm run format:check

            - name: Check release scripts
              run: bash -n scripts/build_nix_release.sh

            - name: Server tests
              run: npm run test:shared-ws && npm run test:server && npm run test:load

    nix:
        name: Nix packages
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Nix
              uses: cachix/install-nix-action@v31

            - name: Check flake
              run: nix flake check --print-build-logs

            - name: Evaluate deployment architectures
              run: |
                  nix eval .#packages.x86_64-linux.gungame-server.drvPath
                  nix eval .#packages.x86_64-linux.gungame-frontend.drvPath
                  nix eval .#packages.aarch64-linux.gungame-server.drvPath
                  nix eval .#packages.aarch64-linux.gungame-frontend.drvPath
